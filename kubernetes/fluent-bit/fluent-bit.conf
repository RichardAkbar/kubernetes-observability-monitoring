[SERVICE]
    Flush           5
    Daemon          Off
    Log_Level       info
    Parsers_File    parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/*.log
    Exclude_Path      /var/log/containers/*_observability_*.log
    multiline.parser  docker, cri
    Tag               kube.*
    Mem_Buf_Limit     30MB
    Skip_Long_Lines   On
    Refresh_Interval  5

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    Merge_Log           On
    Keep_Log            Off
    Labels              Off
    Annotations         Off

[OUTPUT]
    Name   tcp
    Match  kube.*
    Host   logstash.observability.svc.cluster.local
    Port   5000
    Format json_lines
