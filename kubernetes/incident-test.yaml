apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-test
  namespace: observability
  labels:
    app: incident-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: incident-test
  template:
    metadata:
      labels:
        app: incident-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
