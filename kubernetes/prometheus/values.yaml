# Prometheus configuration for Kubernetes playground

server:
  replicaCount: 1

  persistentVolume:
    enabled: false

  retention: "3d"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: false

kube-state-metrics:
  enabled: true

prometheus-node-exporter:
  enabled: true
  hostRootFsMount:
    enabled: false

prometheus-pushgateway:
  enabled: false
